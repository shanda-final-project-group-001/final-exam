services:
  app:
    build:
      context: .
    image: volunteer-agent:latest
    container_name: volunteer-agent
    # 只发布到宿主机回环地址，避免校园网直接访问；外部访问请加认证反向代理
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      VOLUNTEER_DB: /app/data/volunteer_demo.db
    volumes:
      - ./workspace:/app/workspace
    restart: unless-stopped
